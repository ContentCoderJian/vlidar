apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"

    defaultConfig {
        applicationId "com.vlidar.mobile"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        vlidar_key {
            storeFile file('../vlidar.jks')
            storePassword 'android'
            keyAlias = 'vlidar'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            // 是否混淆
            minifyEnabled false
            //是否移除无用资源
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.vlidar_key
        }
        release {
            // 是否混淆
            minifyEnabled false
            //是否移除无用资源
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.vlidar_key
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            assets {
                srcDirs 'src/main/assets', 'src/main/assets/'
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi' //, 'x86_64', 'x86', 'armeabi-v7a', 'arm64-v8a'
            //只打包armeabi平台的，就算有其他文件夹也不管
            // include 'armeabi'//, 'armeabi-v7a', 'arm64-v8a', 'mips', 'x86', 'x86_64'
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    implementation 'com.google.android.material:material:1.3.0-alpha02'
    implementation 'com.android.support:multidex:1.0.3'
    implementation project(':jrecyclerview')
//    implementation project(':wheelview')
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    implementation 'com.jakewharton:butterknife:10.2.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.1'
    implementation 'org.litepal.guolindev:core:3.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.kyleduo.switchbutton:library:2.0.2'

    // 悬浮窗框架：https://github.com/getActivity/XToast
    implementation 'com.hjq:xtoast:6.2'
    implementation 'com.hjq:xxpermissions:9.0'
}
